name: Release

# 打 tag 即建 release（notes 用 .github/RELEASE_TEMPLATE.md 渲染）。
# appx/cer 资产不在仓库——按 AGENTS.md 的既有流程从构建机手动附：
#   gh release upload v<VERSION> <appx> <cer> --clobber
# App 内『检查更新』需要：版本号已升 + release 已建 + appx 已附，三者缺一不可。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要创建/更新 release 的 tag（例如 v0.8.0.0）'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: 创建 / 更新 Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 确认 tag 存在且可解析
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -e
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi
          git rev-parse "refs/tags/$tag" >/dev/null
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: 按模板创建 / 更新 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -e
          ver="${TAG#v}"
          sha=$(git rev-parse --short "$TAG^{commit}")
          notes=$(sed -e "s/{VERSION}/$ver/g" \
                       -e "s/{YYYY-MM-DD}/$(date +%F)/" \
                       -e "s/{SHA}/$sha/g" \
                       .github/RELEASE_TEMPLATE.md)
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --target media-mf --title "v$ver" --notes "$notes"
          else
            echo "release 已存在,更新 notes"
            gh release edit "$TAG" --title "v$ver" --notes "$notes"
          fi
          echo "### 记得从构建机附上手资产:" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "gh release upload $TAG Harness_${ver}_ARM.appx Harness_${ver}_ARM.cer --clobber" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
