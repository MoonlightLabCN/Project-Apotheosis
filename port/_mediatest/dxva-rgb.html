<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>1080p DXVA RGB readback probe</title></head>
<body style="margin:0;background:#101418;color:white;font:16px sans-serif">
<p>1080p RGB readback probe: keep screen on for 30 seconds. Main video uses software decoding.</p>
<video id="v" src="test-1080p.mp4#apotheosis-dxva-rgb-probe" controls autoplay playsinline width="320"></video>
<pre id="state" style="white-space:pre-wrap">Video source is set directly in HTML. Tap the video play control if autoplay is blocked.</pre>
<script>
function snap(tag) {
  var e = document.getElementById('v');
  var text = 't=' + tag + '~rs=' + e.readyState + '~ns=' + e.networkState
    + '~ct=' + e.currentTime.toFixed(3) + '~wh=' + e.videoWidth + 'x' + e.videoHeight
    + '~paused=' + e.paused + '~error=' + (e.error ? e.error.code : '-');
  document.getElementById('state').textContent = text;
  var img = new Image(); img.src = 'dxva-' + text + '.png';
}
['loadstart','loadedmetadata','loadeddata','canplay','playing','error','ended','waiting'].forEach(function (name) {
  document.getElementById('v').addEventListener(name, function () { snap(name); });
});
snap('boot');
setTimeout(function () { snap('t10'); }, 10000);
setTimeout(function () { snap('t30'); }, 30000);
</script></body></html>
