<!doctype html>
<meta charset="utf-8">
<title>nested outer</title>
<body style="font:14px sans-serif;margin:0;padding:8px;background:#fff;color:#111">
<div>outer frame (depth 1)</div>
<iframe id="inner" src="/pages/iframe/child.html?frame=nested&depth=2"
        style="width:100%;height:52px;border:1px solid #ccc"></iframe>
<script>
// Two levels of frame tree. Forwards whatever the grandchild says up to the top,
// tagged so the top page can tell depth 2 from depth 1.
window.addEventListener('message', function (e) {
  var data = e.data;
  try {
    var obj = JSON.parse(data);
    obj.depth = 2;
    data = JSON.stringify(obj);
  } catch (err) { /* not ours; forward verbatim */ }
  try { window.parent.postMessage(data, '*'); } catch (err) {}
});
</script>
</body>
